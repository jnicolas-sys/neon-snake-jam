<script>
const N=30,C=34,PAD=90,cols=['#00ffff','#ff31e6','#caff28','#ff9d21','#28ff7d','#aa66ff','#ff486d','#40a9ff','#ffd83d'],dirs=[[1,0],[-1,0],[0,1],[0,-1]],R=n=>Math.floor(Math.random()*n),K=(x,y)=>x+','+y,inside=(x,y)=>x>=0&&y>=0&&x<N&&y<N;
const vp=document.getElementById('vp'),world=document.getElementById('world'),cv=document.getElementById('map'),cx=cv.getContext('2d');let snakes=[],uid=1,px=0,py=0,drag=null,pan=null,lives=5,mv=0,start=0;
function occ(skip){let o=new Set;snakes.forEach(s=>s.id!==skip&&s.path.forEach(p=>o.add(K(...p))));return o}function hd(s){let a=s.path[0],b=s.path[1];return[a[0]-b[0],a[1]-b[1]]}function nxt(s){let[d,e]=hd(s),h=s.path[0];return[h[0]+d,h[1]+e]}function blocked(s){let p=nxt(s);return inside(...p)&&occ(s.id).has(K(...p))}
function rp(o,len){for(let q=0;q<100;q++){let x=R(N),y=R(N),d=R(4),p=[[x,y]],u=new Set([K(x,y)]);if(o.has(K(x,y)))continue;for(let i=1;i<len;i++){if(i>1&&Math.random()<.6)d=(d<2?[2,3]:[0,1])[R(2)];let nx=x+dirs[d][0],ny=y+dirs[d][1];if(!inside(nx,ny)||o.has(K(nx,ny))||u.has(K(nx,ny))){p=[];break}p.push([nx,ny]);u.add(K(nx,ny));x=nx;y=ny}if(p.length===len){if(Math.random()<.5)p.reverse();return p}}}
function rayClear(path,o){
 let a=path[0],b=path[1],dx=a[0]-b[0],dy=a[1]-b[1],x=a[0]+dx,y=a[1]+dy;
 while(inside(x,y)){if(o.has(K(x,y)))return false;x+=dx;y+=dy}
 return true
}
function edgeScore(p){
 let m=N;
 p.forEach(a=>{m=Math.min(m,a[0],a[1],N-1-a[0],N-1-a[1])});
 return m
}
function make(){
 snakes=[];uid=1;
 let o=new Set,used=0,target=Math.round(N*N*(window.gameDensity||.68)),tries=0;
 while(used<target&&tries++<18000){
  let p=rp(o,4+R(6));if(!p)continue;

  /* La mayoría deben nacer dentro de la maraña. Sólo ~12% pueden tocar
     la franja exterior, suficiente para que exista un comienzo sin regalar
     medio tablero desde el borde. */
  let nearEdge=edgeScore(p)<2;
  if(nearEdge && Math.random()>.12)continue;

  if(!rayClear(p,o))continue;

  let s={id:uid++,path:p,color:cols[R(cols.length)],moving:false};
  snakes.push(s);
  p.forEach(a=>o.add(K(...a)));
  used+=p.length
 }
 lives=5;mv=0;score=0;window.timeUpLock=false;window.gameFinished=false;start=performance.now();updateScore();draw();center();
 document.getElementById('over').classList.remove('on')
}
function pd(points){let a=points.map(p=>[p[0]*C+C/2,p[1]*C+C/2]),d=`M ${a[0][0]} ${a[0][1]}`;for(let i=1;i<a.length;i++)d+=` L ${a[i][0]} ${a[i][1]}`;return d}
function draw(){world.style.cssText+=`;width:${N*C+PAD*2}px;height:${N*C+PAD*2}px;background-size:${C}px ${C}px;background-position:${PAD}px ${PAD}px`;world.innerHTML='';snakes.forEach(s=>{let w=document.createElement('div');w.className='snake';w.dataset.sid=s.id;w.style.transform=`translate(${PAD}px,${PAD}px)`;w.style.setProperty('--c',s.color);let sv=document.createElementNS('http://www.w3.org/2000/svg','svg'),a=document.createElementNS('http://www.w3.org/2000/svg','path'),b=document.createElementNS('http://www.w3.org/2000/svg','path'),d=pd(s.path);a.setAttribute('d',d);a.setAttribute('class','o');b.setAttribute('d',d);b.setAttribute('class','i');sv.append(a,b);w.append(sv);s.path.forEach(p=>{let h=document.createElement('div');h.className='hit';h.style.cssText=`left:${p[0]*C}px;top:${p[1]*C}px;width:${C}px;height:${C}px`;h.style.pointerEvents='auto';h.onpointerdown=e=>snakeDown(e,s);w.append(h)});let p=s.path[0],q=document.createElement('div'),[dx,dy]=hd(s),ang=dx==1?0:dx==-1?180:dy==1?90:-90;q.className='head';q.style.cssText=`left:${p[0]*C+3}px;top:${p[1]*C+4}px;width:${C-6}px;height:${C-8}px;transform:rotate(${ang}deg)`;q.onpointerdown=e=>snakeDown(e,s);w.append(q);world.append(w)});document.getElementById('count').textContent='Serp: '+snakes.length;document.getElementById('moves').textContent='Mov: '+mv;livesEl();mini()}
function livesEl(){document.getElementById('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(5-lives);document.getElementById('countdownEdge')?.classList.toggle('lastlife',lives===1)}
function ap(){px=Math.min(0,Math.max(vp.clientWidth-(N*C+PAD*2),px));py=Math.min(0,Math.max(vp.clientHeight-(N*C+PAD*2),py));world.style.transform=`translate(${px}px,${py}px)`;mini()}
function center(){px=(vp.clientWidth-(N*C+PAD*2))/2;py=(vp.clientHeight-(N*C+PAD*2))/2;ap()}
function activity(){
 if(!snakes.length)return;
 let xs=[],ys=[];
 snakes.forEach(s=>s.path.forEach(p=>{if(inside(...p)){xs.push(p[0]);ys.push(p[1])}}));
 if(!xs.length){center();return}
 let cx0=((Math.min(...xs)+Math.max(...xs)+1)/2)*C+PAD;
 let cy0=((Math.min(...ys)+Math.max(...ys)+1)/2)*C+PAD;
 px=vp.clientWidth/2-cx0;py=vp.clientHeight/2-cy0;ap()
}
function mini(){cx.fillStyle='#080814';cx.fillRect(0,0,192,192);let z=192/N;snakes.forEach(s=>{cx.strokeStyle=s.color;cx.lineWidth=2;cx.beginPath();s.path.forEach((p,i)=>i?cx.lineTo((p[0]+.5)*z,(p[1]+.5)*z):cx.moveTo((p[0]+.5)*z,(p[1]+.5)*z));cx.stroke()});cx.strokeStyle='white';cx.lineWidth=2;cx.strokeRect(-px/(N*C+PAD*2)*192,-py/(N*C+PAD*2)*192,vp.clientWidth/(N*C+PAD*2)*192,vp.clientHeight/(N*C+PAD*2)*192)}
let snakeGesture=null;
function snakeDown(e,s){
 e.preventDefault();e.stopPropagation();
 snakeGesture={s,id:e.pointerId,x:e.clientX,y:e.clientY,px0:px,py0:py,drag:false};
 vp.setPointerCapture?.(e.pointerId)
}
vp.addEventListener('pointermove',e=>{
 if(!snakeGesture||e.pointerId!==snakeGesture.id)return;
 let dx=e.clientX-snakeGesture.x,dy=e.clientY-snakeGesture.y;
 if(!snakeGesture.drag && Math.hypot(dx,dy)>10)snakeGesture.drag=true;
 if(snakeGesture.drag){px=snakeGesture.px0+dx;py=snakeGesture.py0+dy;ap()}
});
vp.addEventListener('pointerup',e=>{
 if(!snakeGesture||e.pointerId!==snakeGesture.id)return;
 let g=snakeGesture;snakeGesture=null;
 if(!g.drag)tryExit(g.s)
});
vp.addEventListener('pointercancel',()=>{snakeGesture=null});
function tryExit(s){
 if(s.moving)return;
 s.moving=true;
 mv++;
 exit(s)
}
function damageFX(){
 let f=document.getElementById('damageFlash');
 vp.classList.remove('quake');f.classList.remove('hit');void vp.offsetWidth;
 vp.classList.add('quake');f.classList.add('hit');
 setTimeout(()=>vp.classList.remove('quake'),430);setTimeout(()=>f.classList.remove('hit'),600)
}
function updateScore(){let e=document.getElementById('scoreNow');if(e)e.textContent=score+' pts'}
function finalScore(){
 let sec=Math.max(1,Math.floor((performance.now()-start)/1000));
 let lifeBonus=lives*1000;
 let remaining=Math.max(0,Math.ceil((levelCfg[currentLevel].time*1000-(performance.now()-start))/1000));
 let timeBonus=remaining*10;
 return {total:score+lifeBonus+timeBonus,sec,lifeBonus,timeBonus}
}
function saveRecord(r){
 let key='nse_records_'+currentLevel,a=JSON.parse(localStorage.getItem(key)||'[]');
 a.push({score:r.total,time:r.sec,lives,date:new Date().toLocaleDateString()});
 a.sort((x,y)=>y.score-x.score||x.time-y.time);a=a.slice(0,10);

}
function win(){
 window.gameFinished=true;
 const edge=document.getElementById('countdownEdge');if(edge)edge.classList.remove('warn','danger','lastlife');
 let r=finalScore(),place=saveRecord(r),ov=document.getElementById('over'),card=ov.querySelector('.card');

}
function fail(){damageFX();lives--;livesEl();document.getElementById('toast').classList.add('on');setTimeout(()=>document.getElementById('toast').classList.remove('on'),650);navigator.vibrate?.([90,35,90]);if(!lives)document.getElementById('over').classList.add('on')}function sd(e,s){e.preventDefault();e.stopPropagation();let[d,f]=hd(s);drag={s,x:e.clientX,y:e.clientY,dx:d,dy:f,done:false}}
vp.onpointerdown=e=>{if(e.target===vp||e.target===world)pan={x:e.clientX,y:e.clientY,px,py}};vp.onpointermove=e=>{if(pan){px=pan.px+e.clientX-pan.x;py=pan.py+e.clientY-pan.y;ap()}};vp.onpointerup=vp.onpointercancel=()=>{drag=null;pan=null};
function renderMovingSnake(s){
 const w=[...world.querySelectorAll('.snake')].find(el=>el.dataset.sid==s.id);
 if(!w)return draw();
 const paths=w.querySelectorAll('svg path'),d=pd(s.path);paths.forEach(p=>p.setAttribute('d',d));
 const h=w.querySelector('.head'),p=s.path[0],[dx,dy]=hd(s),ang=dx==1?0:dx==-1?180:dy==1?90:-90;
 if(h)h.style.cssText=`left:${p[0]*C+3}px;top:${p[1]*C+4}px;width:${C-6}px;height:${C-8}px;transform:rotate(${ang}deg)`;
}
function exit(s){
 let tm=setInterval(()=>{
  if(!snakes.includes(s)){clearInterval(tm);return}
  if(blocked(s)){
   clearInterval(tm);
   s.moving=false;
   fail();
   draw();
   return
  }
  let n=nxt(s);
  s.path.unshift(n);
  s.path.pop();
  renderMovingSnake(s);
  if(s.path.every(p=>!inside(...p))){
   snakes=snakes.filter(x=>x.id!==s.id);
   score+=100;updateScore();
   clearInterval(tm);
   s.moving=false;
   draw();
   navigator.vibrate?.([40,20,65]);
   if(!snakes.length)win()
  }
 },45)
}
setInterval(()=>{if(!start||window.gameFinished)return;const limit=levelCfg[currentLevel].time,elapsed=Math.floor((performance.now()-start)/1000),left=Math.max(0,limit-elapsed),clock=document.getElementById('clock');clock.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');const edge=document.getElementById('countdownEdge');edge.classList.toggle('danger',left>0&&left<=10);edge.classList.toggle('warn',left>10&&left<=30);if(left<=0&&!window.timeUpLock){window.timeUpLock=true;edge.classList.remove('warn','danger');const ov=document.getElementById('over'),card=ov.querySelector('.card');card.innerHTML='<h2>⏱ TIEMPO AGOTADO</h2><p>La maraña ha ganado esta vez.</p><button id="timeAgain">REINTENTAR</button><button id="timeLevels">NIVELES</button>';ov.classList.add('on');document.getElementById('timeAgain').onclick=()=>{ov.classList.remove('on');window.timeUpLock=false;make()};document.getElementById('timeLevels').onclick=()=>{ov.classList.remove('on');window.timeUpLock=false;document.getElementById('levelPanel').classList.remove('off')}}},100);document.getElementById('new').onclick=make;
document.getElementById('center').onclick=activity;

window.onresize=ap;

/* v0.10.0: música aportada por el usuario + latido WebAudio. */
const GAME_MUSIC_SRC="music.mp3";
let gameMusic=new Audio(GAME_MUSIC_SRC);
gameMusic.loop=true;
gameMusic.preload='auto';
gameMusic.volume=.252;

function ensureMusic(){
  if(musicCtx)return;
  musicCtx=new (window.AudioContext||window.webkitAudioContext)();
  musicMaster=musicCtx.createGain();
  musicMaster.gain.value=.62;
  musicMaster.connect(musicCtx.destination);
}
async function toggleMusic(){
  ensureMusic();
  if(musicCtx.state==='suspended')await musicCtx.resume();
  musicOn=!musicOn;
  const b=document.getElementById('musicBtn');
  if(b)b.textContent=musicOn?'♫ MÚSICA ✓':'♫ MÚSICA';
  if(musicOn){
    try{await gameMusic.play()}catch(e){console.warn(e)}
  }else{
    gameMusic.pause();
  }
  try{localStorage.setItem('nse_music',musicOn?'1':'0')}catch(e){}
}
const mb=document.getElementById('musicBtn');if(mb){mb.onclick=toggleMusic;mb.textContent='♫ MÚSICA ✓';}



const coverScreen=document.getElementById('coverScreen');
const coverPlay=document.getElementById('coverPlay');
if(coverPlay)coverPlay.onclick=async()=>{
 coverScreen.classList.add('off');
 ensureMusic();
 if(musicCtx && musicCtx.state==='suspended')await musicCtx.resume();
 musicOn=coverMusicWanted;
 if(musicOn){try{await gameMusic.play()}catch(e){}}
 else gameMusic.pause();
 const mb=document.getElementById('musicBtn');if(mb)mb.textContent=musicOn?'♫ MÚSICA ✓':'♫ MÚSICA';
};


const coverSound=document.getElementById('coverSound');
const mapToggle=document.getElementById('showMap');
const miniMap=document.getElementById('map');
if(mapToggle){mapToggle.checked=false;if(miniMap)miniMap.style.display='none';}
let coverMusicWanted=true;
if(coverSound){
  coverSound.classList.remove('off');
  coverSound.onclick=async()=>{
    coverMusicWanted=!coverMusicWanted;
    coverSound.classList.toggle('off',!coverMusicWanted);
    ensureMusic();
    if(musicCtx && musicCtx.state==='suspended')await musicCtx.resume();
    musicOn=coverMusicWanted;
    if(musicOn){try{await gameMusic.play()}catch(e){}}
    else gameMusic.pause();
    const mb=document.getElementById('musicBtn');if(mb)mb.textContent=musicOn?'♫ MÚSICA ✓':'♫ MÚSICA';
  };
}


if(coverScreen){
 const startCoverMusic=async()=>{
   if(!coverMusicWanted)return;
   ensureMusic();
   if(musicCtx && musicCtx.state==='suspended')await musicCtx.resume();
   musicOn=true;
   try{await gameMusic.play()}catch(e){}
   const mb=document.getElementById('musicBtn');if(mb)mb.textContent='♫ MÚSICA ✓';
 };
 // Intento inmediato. Si el navegador veta autoplay, el primer toque lo desbloquea.
 startCoverMusic();
 coverScreen.addEventListener('pointerdown',startCoverMusic,{once:true});
}
