<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Neon Snake Jam</title><style>:root{--bg:#080814}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 15%,#171738,#080814 55%);color:#fff;font-family:system-ui,Segoe UI,sans-serif;display:flex;justify-content:center;touch-action:none;overflow:hidden}.app{width:min(100%,520px);padding:14px;text-align:center}h1{font-size:22px;letter-spacing:4px;margin:5px 0 8px;text-shadow:0 0 15px #0ff}.stats{display:flex;justify-content:center;gap:18px;font-size:13px;color:#bff;margin:5px}.controls{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}button{border:1px solid #0ff;background:#09091a;color:white;border-radius:8px;padding:8px 10px;font-weight:700}button.active{background:#0ff;color:#001}.boardWrap{display:flex;justify-content:center;margin-top:8px}#board{position:relative;border:3px solid #0ff;border-radius:12px;box-shadow:0 0 25px #0ff5;background-color:#080814;background-image:linear-gradient(#0ff1 1px,transparent 1px),linear-gradient(90deg,#0ff1 1px,transparent 1px)}.snake{position:absolute;display:flex;z-index:4;cursor:grab;filter:drop-shadow(0 0 7px currentColor);will-change:transform}.snake.v{flex-direction:column}.seg{position:relative;border-radius:50%;background:currentColor}.seg:not(:last-child):after{content:'';position:absolute;background:currentColor}.snake.h .seg:not(:last-child):after{left:60%;top:25%;width:80%;height:50%}.snake.v .seg:not(:last-child):after{top:60%;left:25%;height:80%;width:50%}.head{z-index:2}.eye{position:absolute;width:6px;height:6px;background:#fff;border-radius:50%;box-shadow:0 0 4px #fff;z-index:4}.snake.h.dir1 .eye.e1{right:7px;top:7px}.snake.h.dir1 .eye.e2{right:7px;bottom:7px}.snake.h.dir-1 .eye.e1{left:7px;top:7px}.snake.h.dir-1 .eye.e2{left:7px;bottom:7px}.snake.v.dir1 .eye.e1{bottom:7px;left:7px}.snake.v.dir1 .eye.e2{bottom:7px;right:7px}.snake.v.dir-1 .eye.e1{top:7px;left:7px}.snake.v.dir-1 .eye.e2{top:7px;right:7px}.ob{position:absolute;border-radius:8px;background:#ff145f;box-shadow:0 0 12px #ff145f}.msg{height:28px;margin-top:12px;color:#0ff;font-weight:700}.win{position:fixed;inset:0;background:#050510e8;display:none;align-items:center;justify-content:center;z-index:50}.win.show{display:flex}.card{border:2px solid #39ff88;border-radius:18px;padding:28px;background:#101025;box-shadow:0 0 35px #39ff8866}.card h2{color:#39ff88;font-size:28px}.escape{transition:transform .35s ease-in,opacity .35s;opacity:0}</style></head><body><div class="app"><h1>NEON SNAKE JAM</h1><div class="stats"><span id="moves">Movimientos: 0</span><span id="left">Serpientes: 0</span></div><div class="controls"><button id="easy" onclick="start('easy')">Fácil 5×5</button><button id="medium" onclick="start('medium')">Medio 6×6</button><button id="hard" onclick="start('hard')">Alto 7×7</button><button onclick="start(diff)">↻ Reiniciar</button></div><div class="boardWrap"><div id="board"></div></div><div class="msg">Arrastra las serpientes. Solo escapan por la cabeza.</div></div><div class="win" id="win"><div class="card"><h2>¡NIVEL SUPERADO! 🏆</h2><p id="result"></p><button onclick="start(diff)">Nuevo nivel</button></div></div><script>const board=document.getElementById('board'),palette=['#00ffff','#ff31e6','#caff28','#ff9d21','#28ff7d','#aa66ff'];let N=5,C=52,diff='easy',snakes=[],obs=[],moves=0,drag=null,seed=0;function rng(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function start(d){diff=d;N=d==='easy'?5:d==='medium'?6:7;C=Math.floor(Math.min(52,(innerWidth-30)/N));seed=(Date.now()^(N*99991))>>>0;moves=0;document.querySelectorAll('.controls button').forEach(x=>x.classList.remove('active'));document.getElementById(d).classList.add('active');board.style.width=N*C+'px';board.style.height=N*C+'px';board.style.backgroundSize=C+'px '+C+'px';document.getElementById('win').classList.remove('show');makeLevel();render()}function makeLevel(){snakes=[];obs=[];let count=diff==='easy'?5:diff==='medium'?7:9;if(diff==='medium')obs=[{x:2,y:2}];if(diff==='hard')obs=[{x:2,y:2},{x:4,y:4}];let occupied=new Set(obs.map(o=>o.x+','+o.y)),tries=0;while(snakes.length<count&&tries++<1000){let h=rng()>.5,len=rng()>.7?3:2,dir=rng()>.5?1:-1,x=Math.floor(rng()*(N-(h?len:1))),y=Math.floor(rng()*(N-(h?1:len)));let cells=[];for(let i=0;i<len;i++)cells.push([x+(h?i:0),y+(h?0:i)]);if(cells.some(p=>occupied.has(p.join(','))))continue;cells.forEach(p=>occupied.add(p.join(',')));snakes.push({id:Math.random().toString(36).slice(2),x,y,len,h,dir,color:palette[Math.floor(rng()*palette.length)]})}snakes.forEach(s=>{if(s.h&&s.x===0)s.dir=-1;if(s.h&&s.x+s.len===N)s.dir=1;if(!s.h&&s.y===0)s.dir=-1;if(!s.h&&s.y+s.len===N)s.dir=1})}function cellsOf(s,x=s.x,y=s.y){let a=[];for(let i=0;i<s.len;i++)a.push([x+(s.h?i:0),y+(s.h?0:i)]);return a}function occupied(except){let set=new Set(obs.map(o=>o.x+','+o.y));snakes.forEach(s=>{if(s.id!==except)cellsOf(s).forEach(p=>set.add(p.join(',')))});return set}function render(){board.innerHTML='';obs.forEach(o=>{let e=document.createElement('div');e.className='ob';place(e,o.x,o.y);board.append(e)});snakes.forEach(s=>{let e=document.createElement('div');e.className=`snake ${s.h?'h':'v'} dir${s.dir}`;e.style.color=s.color;e.style.left=s.x*C+'px';e.style.top=s.y*C+'px';e.style.width=(s.h?s.len:1)*C+'px';e.style.height=(s.h?1:s.len)*C+'px';for(let i=0;i<s.len;i++){let q=document.createElement('div');q.className='seg';q.style.width=C-10+'px';q.style.height=C-10+'px';q.style.margin='5px';if(i===(s.dir===1?s.len-1:0)){q.classList.add('head');q.innerHTML='<i class="eye e1"></i><i class="eye e2"></i>'}e.append(q)}e.onpointerdown=ev=>down(ev,s,e);board.append(e);s.el=e});stats()}function place(e,x,y){e.style.left=x*C+4+'px';e.style.top=y*C+4+'px';e.style.width=C-8+'px';e.style.height=C-8+'px'}function down(ev,s,e){ev.preventDefault();drag={s,e,sx:ev.clientX,sy:ev.clientY};e.setPointerCapture(ev.pointerId);e.onpointermove=move;e.onpointerup=up;e.onpointercancel=up}function limits(s){let occ=occupied(s.id),neg=0,pos=0;for(let k=1;k<=N;k++){let x=s.x+(s.h?-k:0),y=s.y+(s.h?0:-k);if(x<0||y<0||cellsOf(s,x,y).some(p=>occ.has(p.join(','))))break;neg=k}for(let k=1;k<=N;k++){let x=s.x+(s.h?k:0),y=s.y+(s.h?0:k);if((s.h&&x+s.len>N)||(!s.h&&y+s.len>N)||cellsOf(s,x,y).some(p=>occ.has(p.join(','))))break;pos=k}return[-neg,pos]}function move(ev){if(!drag)return;let s=drag.s,raw=(s.h?ev.clientX-drag.sx:ev.clientY-drag.sy)/C,[mn,mx]=limits(s),v=Math.max(mn-.8,Math.min(mx+.8,raw));drag.e.style.transform=`translate(${s.h?v*C:0}px,${s.h?0:v*C}px)`}function up(ev){if(!drag)return;let {s,e,sx,sy}=drag,raw=(s.h?ev.clientX-sx:ev.clientY-sy)/C,[mn,mx]=limits(s),step=Math.max(mn,Math.min(mx,Math.round(raw))),wants=s.dir===1?raw>mx+.3:raw<mn-.3;if(wants&&exitClear(s)){moves++;let d=(N+2)*C*s.dir;e.classList.add('escape');e.style.transform=`translate(${s.h?d:0}px,${s.h?0:d}px)`;snakes=snakes.filter(q=>q.id!==s.id);setTimeout(()=>{render();if(!snakes.length)won()},350)}else{s.x+=s.h?step:0;s.y+=s.h?0:step;if(step)moves++;e.style.transform='';render()}drag=null}function exitClear(s){let occ=occupied(s.id),hx=s.dir===1?(s.h?s.x+s.len-1:s.x):s.x,hy=s.dir===1?(!s.h?s.y+s.len-1:s.y):s.y;while(true){hx+=s.h?s.dir:0;hy+=s.h?0:s.dir;if(hx<0||hy<0||hx>=N||hy>=N)return true;if(occ.has(hx+','+hy))return false}}function stats(){document.getElementById('moves').textContent='Movimientos: '+moves;document.getElementById('left').textContent='Serpientes: '+snakes.length}function won(){document.getElementById('result').textContent='Has liberado todas las serpientes en '+moves+' movimientos.';document.getElementById('win').classList.add('show');if(navigator.vibrate)navigator.vibrate([80,50,120])}start('easy');</script></body></html>
