<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Neon Snake Jam v0.5.8</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 8%,#202052,#060610 60%);color:#fff;font-family:system-ui,Segoe UI,sans-serif;display:flex;justify-content:center;touch-action:none}.app{width:min(100%,610px);padding:10px;text-align:center}h1{font-size:23px;letter-spacing:3px;margin:5px;text-shadow:0 0 17px #0ff}.sub{color:#8ff;font-size:11px}.screen{display:none}.screen.on{display:block}.card{margin:18px auto;padding:18px;width:min(94%,430px);background:#0d0d24dd;border:1px solid #0ff7;border-radius:17px;box-shadow:0 0 25px #0ff2}.row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:9px}button{border:1px solid #0ff;background:#09091c;color:white;border-radius:9px;padding:8px 12px;font-weight:800}button.active,.primary{background:#0ff;color:#001;box-shadow:0 0 12px #0ff7}.primary{font-size:16px;padding:11px 28px}.danger{border-color:#ff486d;color:#ff8ca3}.hud{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;color:#dff;font-size:12px;margin:5px}.gamebuttons{display:flex;justify-content:center;gap:6px;margin:6px}#board{position:relative;margin:8px auto;border:3px solid #0ff;border-radius:12px;box-shadow:0 0 27px #0ff5;background:#080814;background-image:linear-gradient(#0ff12 1px,transparent 1px),linear-gradient(90deg,#0ff12 1px,transparent 1px);overflow:visible}.snake{position:absolute;inset:0;pointer-events:none;filter:drop-shadow(0 0 7px var(--c));z-index:3}.snakeSvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.snakeOuter{fill:none;stroke:var(--c);stroke-width:18;stroke-linecap:round;stroke-linejoin:round}.snakeInner{fill:none;stroke:#080814;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}.hit{position:absolute;background:transparent;pointer-events:auto;z-index:8;border-radius:14px}.head{position:absolute;background:var(--c);pointer-events:auto;z-index:9;clip-path:polygon(100% 50%,60% 4%,0 13%,10% 50%,0 87%,60% 96%);transform-origin:center}.eye{position:absolute;background:white;border-radius:50%;width:5px;height:5px;top:27%;left:54%;box-shadow:0 0 3px white}.eye.e2{top:auto;bottom:27%}.msg{min-height:32px;color:#8ff;font-size:13px;font-weight:700}.overlay{position:fixed;inset:0;background:#03030def;display:none;align-items:center;justify-content:center;z-index:80}.overlay.on{display:flex}.overlay .card{border-color:#39ff88}.overlay h2{color:#39ff88}.records{font-size:12px;text-align:left}.recrow{display:grid;grid-template-columns:28px 1fr 80px 65px;gap:5px;padding:6px;border-bottom:1px solid #ffffff18}.muted{color:#aaa;font-size:11px}@keyframes boardShake{0%,100%{transform:translate(0,0)}18%{transform:translate(-3px,1px)}36%{transform:translate(3px,-1px)}54%{transform:translate(-2px,-1px)}72%{transform:translate(2px,1px)}}#board.boardShake{animation:boardShake .24s ease-out}</style></head><body><div class="app"><section id="home" class="screen on"><h1>NEON SNAKE JAM</h1><div class="sub">v0.5.8 · APK</div><div class="card"><h3>NUEVA PARTIDA</h3><div>Tamaño</div><div class="row"><button class="sz" data-v="6" onclick="chooseN(6)">6×6</button><button class="sz" data-v="8" onclick="chooseN(8)">8×8</button><button class="sz" data-v="9" onclick="chooseN(9)">9×9</button></div><div>Dificultad</div><div class="row"><button class="df" data-v="easy" onclick="chooseD('easy')">Fácil</button><button class="df" data-v="medium" onclick="chooseD('medium')">Medio</button><button class="df" data-v="hard" onclick="chooseD('hard')">Difícil</button></div><div class="row"><button class="primary" onclick="startGame()">JUGAR</button><button onclick="showRecords()">🏆 RÉCORDS</button></div></div></section><section id="game" class="screen"><h1>NEON SNAKE JAM</h1><div class="hud"><span id="clock">00:00.0</span><span id="moves">Mov: 0</span><span id="left">Serp: 0</span><span id="available">Libres: 0</span></div><div class="gamebuttons"><button onclick="goHome()">☰ Menú</button><button onclick="restart()">↻ Reiniciar</button><button class="danger" onclick="giveUp()">Rendirse</button></div><div id="board"></div><div id="msg" class="msg"></div></section><section id="records" class="screen"><h1>RÉCORDS</h1><div class="card"><div class="row"><button onclick="cycleRecords(-1)">◀</button><b id="recordTitle"></b><button onclick="cycleRecords(1)">▶</button></div><div id="recordList" class="records"></div><div class="row"><button onclick="goHome()">Volver</button></div></div></section></div><div id="overlay" class="overlay"><div class="card"><h2 id="overTitle"></h2><p id="overText"></p><div class="row"><button class="primary" onclick="startGame()">Otro puzle</button><button onclick="goHome()">Menú</button></div></div></div><script>let audioCtx=null,audioMaster=null;function audioReady(){try{if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();audioMaster=audioCtx.createGain();audioMaster.gain.value=.9;audioMaster.connect(audioCtx.destination)}if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}['pointerdown','pointerup','touchstart','click'].forEach(ev=>document.addEventListener(ev,audioReady,{passive:true}));function exitSound(){audioReady();board.classList.remove('boardShake');void board.offsetWidth;board.classList.add('boardShake');setTimeout(()=>board.classList.remove('boardShake'),260);if(navigator.vibrate)navigator.vibrate([45,22,70]);if(!audioCtx||!audioMaster)return;const play=()=>{const now=audioCtx.currentTime+.008,g=audioCtx.createGain();g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.17,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+.31);g.connect(audioMaster);[[330,'sine',0],[495,'triangle',.035]].forEach(x=>{const o=audioCtx.createOscillator(),f=x[0],d=x[2];o.type=x[1];o.frequency.setValueAtTime(f,now+d);o.frequency.exponentialRampToValueAtTime(f*1.65,now+.22+d);o.connect(g);o.start(now+d);o.stop(now+.32)})};if(audioCtx.state==='running')play();else audioCtx.resume().then(play).catch(()=>{})}const board=document.getElementById('board'),COL=['#00ffff','#ff31e6','#caff28','#ff9d21','#28ff7d','#aa66ff','#ff486d','#40a9ff','#ffd83d'],DIR=[[1,0],[-1,0],[0,1],[0,-1]];let N=8,D='medium',C=44,snakes=[],movesN=0,drag=null,uid=1,startAt=0,timer=null,elapsed=0,recordPage=4;const CFG={easy:{density:.42,turn:.20,max:5},medium:{density:.55,turn:.48,max:6},hard:{density:.66,turn:.72,max:7}};const R=n=>Math.floor(Math.random()*n),K=(x,y)=>x+','+y,inside=(x,y)=>x>=0&&y>=0&&x<N&&y<N;function screen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on')}function chooseN(n){N=n;paintChoices()}function chooseD(d){D=d;paintChoices()}function paintChoices(){document.querySelectorAll('.sz').forEach(b=>b.classList.toggle('active',+b.dataset.v===N));document.querySelectorAll('.df').forEach(b=>b.classList.toggle('active',b.dataset.v===D))}function occ(list,skip){let o=new Set;list.forEach(s=>{if(s.id!==skip)s.path.forEach(p=>{if(inside(...p))o.add(K(...p))})});return o}function heading(s){let a=s.path[0],b=s.path[1];return[a[0]-b[0],a[1]-b[1]]}function next(s){let[dx,dy]=heading(s),h=s.path[0];return[h[0]+dx,h[1]+dy]}function stepPossible(s,list=snakes){let p=next(s);return!inside(...p)||!occ(list,s.id).has(K(...p))}function escapePossible(s,list=snakes){let b=s.path.map(p=>[...p]),o=occ(list,s.id);for(let z=0;z<N*3;z++){let dx=b[0][0]-b[1][0],dy=b[0][1]-b[1][1],n=[b[0][0]+dx,b[0][1]+dy];if(!inside(...n))return true;if(o.has(K(...n)))return false;b.unshift(n);b.pop()}return false}function profile(list){let a=list.map(s=>({id:s.id,path:s.path.map(p=>[...p])}));while(a.length){let f=a.filter(s=>escapePossible(s,a));if(!f.length)return false;let ids=new Set(f.map(s=>s.id));a=a.filter(s=>!ids.has(s.id))}return true}function randomPath(o,len,turn){for(let q=0;q<100;q++){let x=R(N),y=R(N),d=R(4),p=[[x,y]],u=new Set([K(x,y)]);if(o.has(K(x,y)))continue;for(let i=1;i<len;i++){if(i>1&&Math.random()<turn)d=(d<2?[2,3]:[0,1])[R(2)];let nx=x+DIR[d][0],ny=y+DIR[d][1];if(!inside(nx,ny)||o.has(K(nx,ny))||u.has(K(nx,ny))){p=[];break}p.push([nx,ny]);u.add(K(nx,ny));x=nx;y=ny}if(p.length===len){if(Math.random()<.5)p.reverse();return p}}return null}function generate(){let target=Math.round(N*N*CFG[D].density);for(let a=0;a<3500;a++){uid=1;let list=[],o=new Set,used=0,t=0;while(used<target&&t++<2800){let len=3+R(CFG[D].max-2),p=randomPath(o,len,CFG[D].turn);if(!p)continue;let s={id:uid++,path:p,color:COL[R(COL.length)]};p.forEach(x=>o.add(K(...x)));list.push(s);used+=len}if(!profile(list))continue;let f=list.filter(s=>escapePossible(s,list)).length;if(D==='hard'&&f>Math.max(2,Math.ceil(list.length*.2)))continue;if(D==='medium'&&f>Math.ceil(list.length*.38))continue;return list}return[]}function startGame(){document.getElementById('overlay').classList.remove('on');screen('game');C=Math.floor(Math.min(48,(innerWidth-24)/N));board.style.width=N*C+'px';board.style.height=N*C+'px';board.style.backgroundSize=C+'px '+C+'px';snakes=generate();if(!snakes.length){setTimeout(startGame,20);return}movesN=0;elapsed=0;startAt=performance.now();clearInterval(timer);timer=setInterval(updateClock,100);render();msg.textContent='Puedes avanzar y soltar. No hay marcha atrás.'}function restart(){startGame()}function goHome(){clearInterval(timer);document.getElementById('overlay').classList.remove('on');screen('home');paintChoices()}function giveUp(){clearInterval(timer);overTitle.textContent='PARTIDA ABANDONADA';overText.textContent='El tablero conservará su dignidad. Más o menos.';overlay.classList.add('on')}function updateClock(){elapsed=performance.now()-startAt;clock.textContent=formatTime(elapsed)}function formatTime(ms){let s=ms/1000,m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+(s%60).toFixed(1).padStart(4,'0')}function advanceOne(s){if(!stepPossible(s))return false;let n=next(s);s.path.unshift(n);s.path.pop();return true}function render(){board.innerHTML='';snakes.forEach(s=>drawSnake(s));moves.textContent='Mov: '+movesN;left.textContent='Serp: '+snakes.length;available.textContent='Libres: '+snakes.filter(s=>escapePossible(s)).length}function roundedPath(points){if(points.length<2)return'';const pts=points.map(p=>[p[0]*C+C/2,p[1]*C+C/2]);let d=`M ${pts[0][0]} ${pts[0][1]}`,radius=C*.28;for(let i=1;i<pts.length-1;i++){let a=pts[i-1],b=pts[i],c=pts[i+1],v1=[a[0]-b[0],a[1]-b[1]],v2=[c[0]-b[0],c[1]-b[1]],l1=Math.hypot(...v1),l2=Math.hypot(...v2),r=Math.min(radius,l1*.42,l2*.42),p1=[b[0]+v1[0]/l1*r,b[1]+v1[1]/l1*r],p2=[b[0]+v2[0]/l2*r,b[1]+v2[1]/l2*r];d+=` L ${p1[0]} ${p1[1]} Q ${b[0]} ${b[1]} ${p2[0]} ${p2[1]}`}let z=pts[pts.length-1];return d+` L ${z[0]} ${z[1]}`}function drawSnake(s){let w=document.createElement('div');w.className='snake';w.style.setProperty('--c',s.color);let visible=s.path.filter(p=>inside(...p));if(visible.length>=2){let svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','snakeSvg');let d=roundedPath(visible),outer=document.createElementNS('http://www.w3.org/2000/svg','path'),inner=document.createElementNS('http://www.w3.org/2000/svg','path');outer.setAttribute('d',d);outer.setAttribute('class','snakeOuter');inner.setAttribute('d',d);inner.setAttribute('class','snakeInner');svg.append(outer,inner);w.append(svg)}s.path.forEach(p=>{if(!inside(...p))return;let hit=document.createElement('div');hit.className='hit';hit.style.left=p[0]*C+'px';hit.style.top=p[1]*C+'px';hit.style.width=C+'px';hit.style.height=C+'px';hit.onpointerdown=v=>down(v,s);w.append(hit)});let p=s.path[0];if(inside(...p)){let q=document.createElement('div');q.className='head';let[dx,dy]=heading(s),ang=dx===1?0:dx===-1?180:dy===1?90:-90;q.style.transform=`rotate(${ang}deg)`;q.innerHTML='<i class="eye"></i><i class="eye e2"></i>';q.style.left=p[0]*C+C*.08+'px';q.style.top=p[1]*C+C*.12+'px';q.style.width=C*.84+'px';q.style.height=C*.76+'px';q.onpointerdown=v=>down(v,s);w.append(q)}board.append(w)}function down(v,s){v.preventDefault();let[dx,dy]=heading(s);drag={s,x:v.clientX,y:v.clientY,dx,dy,steps:0};document.onpointermove=moveDrag;document.onpointerup=endDrag}function moveDrag(v){if(!drag)return;let d=(v.clientX-drag.x)*drag.dx+(v.clientY-drag.y)*drag.dy,wanted=Math.floor(Math.max(0,d)/Math.max(18,C*.62));while(drag.steps<wanted){if(!advanceOne(drag.s))break;drag.steps++;render();if(!snakes.includes(drag.s))break}}function endDrag(){document.onpointermove=null;document.onpointerup=null;if(!drag)return;let s=drag.s;if(drag.steps>0){movesN++;navigator.vibrate?.(12);if(s.path.every(p=>!inside(...p))){snakes=snakes.filter(x=>x.id!==s.id)}else if(!inside(...s.path[0])){autoExit(s);render();drag=null;return}render();checkEnd()}drag=null}function autoExit(s){let guard=0;function tick(){if(!snakes.includes(s))return;if(guard++>=N+s.path.length+3||!stepPossible(s)){render();checkEnd();return}advanceOne(s);render();if(s.path.every(p=>!inside(...p))){exitSound();setTimeout(()=>{snakes=snakes.filter(x=>x.id!==s.id);render();checkEnd()},120);return}setTimeout(tick,120)}setTimeout(tick,90)}function checkEnd(){if(!snakes.length){clearInterval(timer);elapsed=performance.now()-startAt;saveRecord();overTitle.textContent='¡NIVEL SUPERADO! 🏆';overText.textContent=`${N}×${N} · ${nameD()} · ${formatTime(elapsed)} · ${movesN} movimientos`;overlay.classList.add('on');navigator.vibrate?.([60,35,100]);return}if(!snakes.some(s=>stepPossible(s))){clearInterval(timer);overTitle.textContent='SIN MOVIMIENTOS';overText.textContent='Has conseguido convertir un tablero solucionable en una elegante catástrofe.';overlay.classList.add('on')}}function nameD(){return D==='easy'?'Fácil':D==='medium'?'Medio':'Difícil'}function recKey(n=N,d=D){return'nsj_'+n+'_'+d}function saveRecord(){let a=JSON.parse(localStorage.getItem(recKey())||'[]');a.push({t:Math.round(elapsed),m:movesN,date:new Date().toLocaleDateString('es-ES')});a.sort((x,y)=>x.t-y.t||x.m-y.m);localStorage.setItem(recKey(),JSON.stringify(a.slice(0,10)))}const combos=[[6,'easy'],[6,'medium'],[6,'hard'],[8,'easy'],[8,'medium'],[8,'hard'],[9,'easy'],[9,'medium'],[9,'hard']];function showRecords(){recordPage=combos.findIndex(x=>x[0]===N&&x[1]===D);screen('records');drawRecords()}function cycleRecords(x){recordPage=(recordPage+x+9)%9;drawRecords()}function drawRecords(){let[n,d]=combos[recordPage],nm=d==='easy'?'Fácil':d==='medium'?'Medio':'Difícil';recordTitle.textContent=n+'×'+n+' · '+nm;let a=JSON.parse(localStorage.getItem(recKey(n,d))||'[]');recordList.innerHTML=a.length?a.map((r,i)=>`<div class="recrow"><b>${i+1}.</b><span>${r.date}</span><b>${formatTime(r.t)}</b><span>${r.m} mov.</span></div>`).join(''):'<p class="muted">Todavía no hay récords en esta combinación.</p>'}paintChoices();</script></body></html>
